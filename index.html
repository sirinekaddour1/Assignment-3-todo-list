<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-container">

        <h1>My To-Do List</h1>

        <!-- là où l’utilisateur écrit sa tâche -->
        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
            >

        <!-- le bouton pour ajouter la tâche -->
            <button id="addButton">
                Add
            </button>
        </div>

        <p id="message"></p> <!-- On l’utilisera pour afficher un message si l’utilisateur essaye d’ajouter une tâche vide -->

        <ul id="taskList"></ul> <!--ici JavaScript va générer les tâches -->

    </main>

    <script src="script.js"></script>

</body>

</html>
